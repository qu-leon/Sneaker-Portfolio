services:
  - type: web
    name: sneaker-portfolio-kicksdb-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node kicksdb-api-server.cjs
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: KICKSDB_API_KEY
        sync: false
      - key: KICKSDB_BASE_URL
        value: https://api.kicks.dev
      - key: KICKSDB_MARKET
        value: US
      - key: KICKSDB_CURRENCY
        value: USD
